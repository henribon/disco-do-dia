name: Atualiza os discos do Notion

on:
  schedule:
    # Todo dia, 09:00 UTC (6h em Brasilia). A base ganha um disco por dia,
    # entao diario e o ritmo certo.
    - cron: '0 9 * * *'
  workflow_dispatch:

# Um job por vez: duas execucoes em paralelo dariam conflito no push.
concurrency:
  group: discos-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Puxa do Notion e busca as capas
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: node scripts/update.mjs

      - name: Commita se mudou
        run: |
          git config user.name "notion-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet && echo "sem mudanca" && exit 0
          git commit -m "chore: atualiza os discos"
          git push
